<div class="app-shell" style="background: #f8fafc">
  <app-sidebar [open]="menuOpen()" (closed)="menuOpen.set(false)" />
  <main class="main-area">
    <header class="topbar">
      <div class="topbar-left">
        <button aria-label="Abrir menú" class="icon-button mobile-menu-button" (click)="menuOpen.set(true)">
          <svg lucideMenu [size]="21"></svg>
        </button>
        <div class="breadcrumbs">
          <span>{{ breadcrumb().section }}</span>
          <span class="breadcrumb-divider">/</span>
          <strong>{{ breadcrumb().title }}</strong>
        </div>
      </div>
      <div class="topbar-actions">
        <label class="search-box" [class.search-box-open]="searchOpen()">
          <svg lucideSearch [size]="17"></svg>
          <input
            id="global-search"
            placeholder="Buscar..."
            type="search"
            (focus)="searchOpen.set(true)"
            (blur)="searchOpen.set(false)"
          />
          <kbd><svg lucideCommand [size]="11"></svg> K</kbd>
        </label>
        <span class="topbar-divider"></span>
        <button aria-label="Notificaciones" class="icon-button notification-button">
          <svg lucideBell [size]="18"></svg>
          <span class="notification-dot"></span>
        </button>
        <div class="topbar-user">
          <div class="avatar avatar-user">EP</div>
          <svg lucideChevronDown [size]="14"></svg>
        </div>
      </div>
    </header>

    <router-outlet />
  </main>
</div>
