@if (auth.isAuthenticated()) {
  <div class="app-shell" style="background: var(--bg)">
    <app-sidebar [open]="menuOpen()" (closed)="menuOpen.set(false)" />
    <main class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button aria-label="Abrir menú" class="icon-button mobile-menu-button" (click)="menuOpen.set(true)">
            <svg lucideMenu [size]="21"></svg>
          </button>
          <div class="breadcrumbs">
            <span>{{ breadcrumb().section }}</span>
            <span class="breadcrumb-divider">/</span>
            <strong>{{ breadcrumb().title }}</strong>
          </div>
        </div>
        <div class="topbar-actions">
          <app-global-search />
          <span class="topbar-divider"></span>
          <app-notifications-menu />
          <app-user-menu />
        </div>
      </header>

      <router-outlet />
    </main>
  </div>
} @else {
  <router-outlet />
}
